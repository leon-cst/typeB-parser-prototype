<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Type B Admin{% endblock %}</title>
</head>
<body>
    <nav>
        <a href="{{ url_for('dashboard.list_agreements') }}">Agreements</a>
    </nav>

    <hr>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <ul>
            {% for category, message in messages %}
                <li>[{{ category }}] {{ message }}</li>
            {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</body>
</html>
