{% extends "base.html" %}

{% block title %}Parse Message{% endblock %}
{% block page_heading %}Parse Message{% endblock %}
{% block breadcrumb_current %}Parse{% endblock %}

{% block content %}
<div class="row">
    <div class="col-xl-8">
        <div class="card">
            <div class="card-body">

                <h4 class="card-title mb-4">Paste a Type B Booking Message</h4>

                <form method="post">
                    <div class="mb-3">
                        <textarea name="raw_message" class="form-control" rows="16"
                                  style="font-family: monospace;"
                                  placeholder="QU CGKRM8G&#10;.SINRMGDS 301658&#10;...">{{ raw_message or "" }}</textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <i class="bx bx-scan me-1"></i> Parse &amp; Preview
                    </button>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
